name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install PWABuilder CLI
        run: npm install -g @pwabuilder/pwapush

      - name: Generate Android Package
        uses: pwabuilder/pwabuilder-action@v2
        with:
          url: 'https://ca-karan23.github.io/casio-mj12d-ca/'
          platform: 'android'
          output: './android-app'
