name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_NAME: CA Calculator
  APP_ID: com.karan.cacalculator
  BG_COLOR: "#0b0d10"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Prepare web assets
        run: |
          mkdir -p apkbuild/www
          cp index.html apkbuild/www/
          cp casio.png apkbuild/www/
          for f in manifest.json sw.js; do
            if [ -f "$f" ]; then cp "$f" apkbuild/www/; fi
          done

      - name: Create Capacitor Android project
        working-directory: apkbuild
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Set icon + splash from casio.png
        working-directory: apkbuild
        run: |
          RES=android/app/src/main/res
          BG="$BG_COLOR"

          # crop the transparent border around the calculator cutout
          convert www/casio.png -trim +repage /tmp/calc.png

          # launcher icons per density: name:adaptive-foreground-px:legacy-px
          for d in mdpi:108:48 hdpi:162:72 xhdpi:216:96 xxhdpi:324:144 xxxhdpi:432:192; do
            IFS=: read name fg legacy <<< "$d"
            dir="$RES/mipmap-$name"
            mkdir -p "$dir"
            # adaptive foreground: transparent, calculator inside the safe zone (the launcher adds the rounded mask)
            box=$(( fg * 60 / 100 ))
            convert /tmp/calc.png -resize "${box}x${box}" -background none -gravity center -extent "${fg}x${fg}" -depth 8 "$dir/ic_launcher_foreground.png"
            # legacy icon (old Android): calculator on solid background
            lbox=$(( legacy * 80 / 100 ))
            convert -size "${legacy}x${legacy}" xc:"$BG" \( /tmp/calc.png -resize "${lbox}x${lbox}" \) -gravity center -composite -depth 8 "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

          # adaptive icon background colour
          mkdir -p "$RES/values"
          cat > "$RES/values/ic_launcher_background.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">$BG</color>
          </resources>
          EOF

          # splash screens: keep each file's size, draw calculator centred on the background colour
          find "$RES" -name 'splash*.png' | while read -r f; do
            size=$(identify -format '%wx%h' "$f")
            W=${size%x*}; H=${size#*x}
            M=$(( W < H ? W : H ))
            convert -size "${W}x${H}" xc:"$BG" \( /tmp/calc.png -resize "x$(( M * 35 / 100 ))" \) -gravity center -composite -depth 8 "$f"
          done

      - name: Patch AndroidManifest (vibration + portrait)
        working-directory: apkbuild
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' "$M"
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' "$M"

      - name: Build APK
        working-directory: apkbuild/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../CA-Calculator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CA-Calculator-APK
          path: apkbuild/CA-Calculator.apk
          if-no-files-found: error
