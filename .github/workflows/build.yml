name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web assets
        run: |
          mkdir -p apkbuild/www
          cp index.html apkbuild/www/
          cp casio.png apkbuild/www/

      - name: Create Capacitor Android project
        working-directory: apkbuild
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Casio MJ12D CA" com.karan.casiomj12d --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: apkbuild/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: casio-apk
          path: apkbuild/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
