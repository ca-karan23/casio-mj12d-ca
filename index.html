<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0d10">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Casio MJ-12D CA Calculator - By Karan</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{background:#0b0d10;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;margin:0;padding:10px;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#e2e8f0}
.utility-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;justify-content:center;z-index:10}
.util-btn{background:#1a202c;color:#38bdf8;border:1px solid #2d3748;padding:7px 14px;border-radius:18px;font-size:12px;font-weight:bold;cursor:pointer;transition:.12s;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.util-btn.off{color:#94a3b8;border-color:#1e293b;background:#131720}
.util-btn:active{transform:scale(.95)}
.ca-drawer{display:none;background:#151821;border:1px solid #2d3748;border-radius:12px;padding:8px;width:390px;max-width:95vw;margin-bottom:10px;grid-template-columns:repeat(4,1fr);gap:6px;box-shadow:0 8px 20px rgba(0,0,0,.6)}
.ca-drawer.open{display:grid}
.ca-chip{background:#232938;color:#f8fafc;border:1px solid #3b4252;padding:7px 4px;font-size:11px;border-radius:6px;cursor:pointer;font-weight:bold}
.ca-chip:active{transform:scale(.95);background:#334155}
.calc-wrapper{position:relative;width:390px;max-width:95vw;aspect-ratio:910/1015;border-radius:34px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.95),0 0 0 2px #1a1a1c;background:#1d1e20}
#casioCutout{position:absolute;top:-4.6%;left:-8.75%;width:117.5%;height:109.2%;object-fit:fill;pointer-events:none;z-index:1;image-rendering:-webkit-optimize-contrast;image-rendering:high-quality}
.lcd-overlay{position:absolute;top:15.6%;left:14.5%;width:71%;height:15.9%;background:linear-gradient(180deg,#b8c4b4 0%,#aebba9 100%);border-radius:4px;padding:4px 10px;display:flex;flex-direction:column;justify-content:space-between;color:#111612;box-shadow:inset 0 2px 6px rgba(0,0,0,.42);z-index:2;overflow:hidden}
.lcd-header{display:flex;justify-content:space-between;align-items:center;height:18px;font-family:'Courier New',Courier,monospace;font-weight:900}
.lcd-step-box{font-size:15px;letter-spacing:-.5px;min-width:36px}
.lcd-badges{display:flex;gap:4px;font-size:10px;letter-spacing:.2px}
.badge{padding:1px 3px;border-radius:2px;opacity:.1}
.badge.active{opacity:1;background:#111612;color:#b8c4b4}
.lcd-op-box{font-size:16px;font-weight:900;min-width:24px;text-align:right}
.lcd-main-row{display:flex;justify-content:space-between;align-items:baseline;height:44px}
.lcd-left-flags{display:flex;align-items:center;font-family:'Courier New',monospace;font-size:15px;font-weight:900;min-width:16px}
.flag-item{opacity:0}
.flag-item.active{opacity:1}
.lcd-digits{font-family:'Courier New',Courier,monospace;font-size:31px;font-weight:900;text-align:right;letter-spacing:-.5px;line-height:42px;white-space:nowrap;flex-grow:1;min-width:0;overflow:hidden}
.key-hotspot{position:absolute;background:rgba(255,255,255,0);border:none;border-radius:8px;cursor:pointer;z-index:3;transition:background .04s,transform .04s}
.key-hotspot:active,.key-hotspot.pressed{background:rgba(0,0,0,.42);transform:scale(.94)}
.karan-signature{width:390px;max-width:95vw;text-align:right;margin-top:6px;padding-right:8px;font-size:11px;font-weight:600;color:#64748b;letter-spacing:.6px}
</style>
</head>
<body>

<div class="utility-bar">
    <button class="util-btn" onpointerdown="Feedback.trigger()" onclick="UIController.toggleDrawer()">⚡ CA GST &amp; Currency ▼</button>
    <button class="util-btn" id="btnSound" onpointerdown="Feedback.toggleSound()">🔊 Sound: ON</button>
    <button class="util-btn" id="btnVibrate" onpointerdown="Feedback.toggleVibrate()">📳 Vibrate: ON</button>
</div>

<div class="ca-drawer" id="caDrawer">
    <button class="ca-chip" onpointerdown="Feedback.trigger()" onclick="Engine.quickConvert(84)">₹ ➔ $ USD</button>
    <button class="ca-chip" onpointerdown="Feedback.trigger()" onclick="Engine.quickConvert(91)">₹ ➔ € EUR</button>
    <button class="ca-chip" onpointerdown="Feedback.trigger()" onclick="Engine.quickGST(18, true)">+18% GST</button>
    <button class="ca-chip" onpointerdown="Feedback.trigger()" onclick="Engine.quickGST(18, false)">-18% GST</button>
    <button class="ca-chip" onpointerdown="Feedback.trigger()" onclick="Engine.quickConvert(108)">₹ ➔ £ GBP</button>
    <button class="ca-chip" onpointerdown="Feedback.trigger()" onclick="Engine.quickGST(5, true)">+5% GST</button>
    <button class="ca-chip" onpointerdown="Feedback.trigger()" onclick="Engine.quickGST(12, true)">+12% GST</button>
    <button class="ca-chip" onpointerdown="Feedback.trigger()" onclick="Engine.quickGST(28, true)">+28% GST</button>
</div>

<div class="calc-wrapper" id="calcWrapper">
    <!-- Local casio.png loads first (offline); falls back to ImgBB -->
    <img id="casioCutout" src="casio.png" onerror="this.onerror=null; this.src='https://i.ibb.co/7MjBpJy/Casio-MJ-12-D-Calculator-Cutout.png';" alt="Casio MJ-12D">

    <div class="lcd-overlay">
        <div class="lcd-header">
            <div class="lcd-step-box" id="uiStep"></div>
            <div class="lcd-badges">
                <span class="badge" id="uiAns">ANS</span>
                <span class="badge" id="uiRev">REV</span>
                <span class="badge" id="uiCrt">CRT</span>
                <span class="badge" id="uiGT">GT</span>
                <span class="badge" id="uiMem">MEMORY</span>
                <span class="badge" id="uiConst">K</span>
            </div>
            <div class="lcd-op-box" id="uiOp"></div>
        </div>
        <div class="lcd-main-row">
            <div class="lcd-left-flags"><span class="flag-item" id="uiErr">E</span></div>
            <div class="lcd-digits" id="uiDigits">0.</div>
        </div>
    </div>
    <!-- Key hotspots are generated by UIController.buildKeys() -->
</div>

<div class="karan-signature">By Karan</div>

<script>
/** 0. SOUND & VIBRATION */
const Feedback = {
    soundEnabled: true,
    vibrateEnabled: true,
    audioCtx: null,

    init() {
        try {
            const s = localStorage.getItem('karan_calc_sound');
            const v = localStorage.getItem('karan_calc_vib');
            if (s !== null) this.soundEnabled = (s === 'true');
            if (v !== null) this.vibrateEnabled = (v === 'true');
        } catch (e) {}
        this.updateButtons();
    },
    toggleSound() {
        this.soundEnabled = !this.soundEnabled;
        try { localStorage.setItem('karan_calc_sound', this.soundEnabled); } catch (e) {}
        this.updateButtons();
        this.trigger('NORMAL');
    },
    toggleVibrate() {
        this.vibrateEnabled = !this.vibrateEnabled;
        try { localStorage.setItem('karan_calc_vib', this.vibrateEnabled); } catch (e) {}
        this.updateButtons();
        this.trigger('AC');
    },
    updateButtons() {
        const sBtn = document.getElementById('btnSound');
        const vBtn = document.getElementById('btnVibrate');
        if (!sBtn || !vBtn) return;
        sBtn.innerText = this.soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
        sBtn.className = 'util-btn' + (this.soundEnabled ? '' : ' off');
        vBtn.innerText = this.vibrateEnabled ? '📳 Vibrate: ON' : '📴 Vibrate: OFF';
        vBtn.className = 'util-btn' + (this.vibrateEnabled ? '' : ' off');
    },
    trigger(keyType = 'NORMAL') {
        if (this.vibrateEnabled) {
            const duration = (keyType === 'AC' || keyType === '=') ? 45 : 30;
            try {
                if (navigator.vibrate) navigator.vibrate(duration);
                else if (window.Android && typeof window.Android.vibrate === 'function') window.Android.vibrate(duration);
            } catch (e) {}
        }
        if (!this.soundEnabled) return;
        try {
            if (!this.audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                this.audioCtx = new AC();
            }
            if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
            const now = this.audioCtx.currentTime;
            const osc = this.audioCtx.createOscillator();
            const gain = this.audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime((keyType === '=' || keyType === 'AC') ? 180 : 230, now);
            osc.frequency.exponentialRampToValueAtTime(48, now + 0.032);
            gain.gain.setValueAtTime(0.45, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.032);
            osc.connect(gain);
            gain.connect(this.audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.035);
        } catch (err) {}
    }
};

/** 1. DECIMAL PRECISION ENGINE */
const MathEngine = {
    MAX_DIGITS: 12,
    LIMIT: 999999999999,

    clean(num) {
        if (!isFinite(num) || isNaN(num)) return { val: 0, overflow: true };
        return this.fitTo12Digits(Number(num.toPrecision(14)));
    },
    fitTo12Digits(num) {
        if (Math.abs(num) > this.LIMIT) {
            return { val: this.truncateTo12(num / 1e12), overflow: true };
        }
        return { val: this.truncateTo12(num), overflow: false };
    },
    truncateTo12(num) {
        if (num === 0) return 0;
        const sign = num < 0 ? -1 : 1;
        const abs = Math.abs(num);
        if (abs >= 1e11) return sign * Math.round(abs);          // already 12+ integer digits
        const intDigits = abs < 1 ? 1 : String(Math.floor(abs)).length;
        const factor = Math.pow(10, this.MAX_DIGITS - intDigits);
        return sign * Math.round((abs + Number.EPSILON) * factor) / factor;
    },
    exec(a, b, op) {
        let raw = 0;
        switch (op) {
            case '+': raw = a + b; break;
            case '-': raw = a - b; break;
            case '*': raw = a * b; break;
            case '/':
                if (b === 0) return { val: 0, overflow: true };
                raw = a / b;
                break;
            default: raw = b;
        }
        return this.clean(raw);
    },
    // Mark-up: returns raw value or null on divide-by-zero
    mu(a, b, op) {
        if (op === '/') { const d = 1 - b / 100; return d === 0 ? null : a / d; }
        if (op === '*') return a * (1 + b / 100);
        if (op === '-') return b === 0 ? null : ((a - b) / b) * 100;
        if (op === '+') return b === 0 ? null : ((a + b) / b) * 100;
        return null;
    }
};

/** 2. CASIO MJ-12D STATE ENGINE */
const Engine = {
    state: {
        inputBuffer: '0',
        accumulator: null,
        pendingOp: null,
        constantMode: false,
        constantOp: null,
        constantVal: null,
        repeatOp: null,
        repeatVal: null,
        enteringNew: true,     // next digit starts a fresh number
        fnResult: false,       // buffer holds a value from sqrt / MRC / GT / converter that counts as an operand
        isAnswerShown: false,
        errorState: false,
        stepOverflow: false,
        memory: 0,
        grandTotal: 0,
        mrcPendingClear: false,
        dispMode: 0,
        steps: [],
        mode: 'NORMAL',
        reviewIdx: 0,
        autoTimer: null
    },

    init() { Display.render(this.state); },

    stopAutoReview() {
        if (this.state.autoTimer) {
            clearInterval(this.state.autoTimer);
            this.state.autoTimer = null;
        }
    },

    recordStep(val, op, isResult = false) {
        if (this.state.steps.length >= 150) { this.state.stepOverflow = true; return; }
        this.state.steps.push({ val, op, isResult });
    },

    getCurrentNumber() {
        const v = parseFloat(this.state.inputBuffer);
        return isNaN(v) ? 0 : v;
    },

    // Avoids "1e-7" style strings reaching the display
    setNumberToBuffer(num) {
        let s = String(num);
        if (/e/i.test(s)) s = Number(num).toFixed(11).replace(/0+$/, '').replace(/\.$/, '');
        if (parseFloat(s) === 0) s = '0';
        this.state.inputBuffer = s;
    },

    hasOperand() { return !this.state.enteringNew || this.state.fnResult; },

    markResult() {
        this.state.enteringNew = true;
        this.state.fnResult = true;
    },

    pressDigit(d) {
        this.stopAutoReview();
        const st = this.state;
        if (st.errorState) return;
        st.mrcPendingClear = false;
        if (st.mode === 'REVIEW') return;

        if (st.enteringNew) {
            st.inputBuffer = (d === '00') ? '0' : d;
            st.enteringNew = false;
            st.fnResult = false;
            st.isAnswerShown = false;
        } else if (st.inputBuffer === '0') {
            st.inputBuffer = (d === '00') ? '0' : d;
        } else if (st.inputBuffer === '-0') {
            st.inputBuffer = (d === '00') ? '-0' : '-' + d;
        } else {
            const rawLen = st.inputBuffer.replace('-', '').replace('.', '').length;
            if (rawLen + d.length <= 12) st.inputBuffer += d;
            else if (d === '00' && rawLen + 1 === 12) st.inputBuffer += '0';
        }
        Display.render(st);
    },

    pressDecimal() {
        this.stopAutoReview();
        const st = this.state;
        if (st.errorState || st.mode === 'REVIEW') return;
        st.mrcPendingClear = false;

        if (st.enteringNew) {
            st.inputBuffer = '0.';
            st.enteringNew = false;
            st.fnResult = false;
            st.isAnswerShown = false;
        } else if (!st.inputBuffer.includes('.')) {
            if (st.inputBuffer.replace('-', '').length < 12) st.inputBuffer += '.';
        }
        Display.render(st);
    },

    pressBackspace() {
        this.stopAutoReview();
        const st = this.state;
        if (st.errorState || st.mode === 'REVIEW' || st.isAnswerShown || st.enteringNew) return;
        st.mrcPendingClear = false;
        let s = st.inputBuffer;
        s = s.length > 1 ? s.slice(0, -1) : '0';
        if (s === '-' || s === '') s = '0';
        st.inputBuffer = s;
        Display.render(st);
    },

    pressSign() {
        this.stopAutoReview();
        const st = this.state;
        if (st.errorState || st.mode === 'REVIEW') return;
        st.mrcPendingClear = false;
        if (this.getCurrentNumber() === 0) return;
        st.inputBuffer = st.inputBuffer.startsWith('-') ? st.inputBuffer.slice(1) : '-' + st.inputBuffer;
        if (st.mode === 'NORMAL' && st.enteringNew && st.accumulator !== null && !st.fnResult) {
            st.accumulator = -st.accumulator;
        }
        Display.render(st);
    },

    pressOperator(op) {
        this.stopAutoReview();
        const st = this.state;
        if (st.errorState) return;
        st.mrcPendingClear = false;

        if (st.mode === 'CORRECT') { this.commitCorrection(op); return; }
        if (st.mode === 'REVIEW') st.mode = 'NORMAL';

        const currentVal = this.getCurrentNumber();

        // Pressing the same operator twice toggles constant (K) mode
        if (st.enteringNew && st.pendingOp === op && !st.isAnswerShown && !st.fnResult) {
            st.constantMode = !st.constantMode;
            st.constantOp = st.constantMode ? op : null;
            st.constantVal = st.constantMode ? currentVal : null;
            Display.render(st);
            return;
        }
        st.constantMode = false;

        if (st.accumulator === null) {
            // Fresh chain: start with a clean step history
            st.steps = [];
            st.stepOverflow = false;
            st.accumulator = currentVal;
            this.recordStep(currentVal, op, false);
        } else if (this.hasOperand()) {
            const res = MathEngine.exec(st.accumulator, currentVal, st.pendingOp);
            this.recordStep(currentVal, op, false);
            st.accumulator = res.val;
            this.setNumberToBuffer(res.val);
            if (res.overflow) {
                st.errorState = true;
                Display.render(st);
                return;
            }
        } else if (st.steps.length > 0) {
            st.steps[st.steps.length - 1].op = op;   // operator changed before a number was entered
        }

        st.pendingOp = op;
        st.repeatOp = op;
        st.repeatVal = currentVal;
        st.enteringNew = true;
        st.fnResult = false;
        st.isAnswerShown = false;
        Display.render(st);
    },

    pressEquals() {
        this.stopAutoReview();
        const st = this.state;
        if (st.errorState) return;
        st.mrcPendingClear = false;

        if (st.mode === 'CORRECT') { this.commitCorrection(null); return; }
        if (st.mode === 'REVIEW') st.mode = 'NORMAL';

        const currentVal = this.getCurrentNumber();
        const hasOp = this.hasOperand();
        st.fnResult = false;

        if (st.constantMode && st.constantOp) {
            const res = (st.constantOp === '*')
                ? MathEngine.exec(st.constantVal, currentVal, '*')
                : MathEngine.exec(currentVal, st.constantVal, st.constantOp);
            this.setNumberToBuffer(res.val);
            if (res.overflow) st.errorState = true; else this.addToGT(res.val);
            st.accumulator = null;
            st.pendingOp = null;
            st.enteringNew = true;
            st.isAnswerShown = true;
            Display.render(st);
            return;
        }

        if (st.pendingOp !== null) {
            const secondOperand = hasOp ? currentVal : st.accumulator;

            if (!hasOp && (st.pendingOp === '*' || st.pendingOp === '/')) {
                st.constantMode = true;
                st.constantOp = st.pendingOp;
                st.constantVal = st.accumulator;
            }

            const res = MathEngine.exec(st.accumulator, secondOperand, st.pendingOp);
            this.recordStep(secondOperand, '=', false);
            this.recordStep(res.val, '', true);

            st.repeatOp = st.pendingOp;
            st.repeatVal = secondOperand;

            this.setNumberToBuffer(res.val);
            st.accumulator = null;
            st.pendingOp = null;
            st.enteringNew = true;
            st.isAnswerShown = true;
            if (res.overflow) st.errorState = true; else this.addToGT(res.val);
        } else if (st.repeatOp !== null && st.repeatVal !== null) {
            const res = MathEngine.exec(currentVal, st.repeatVal, st.repeatOp);
            this.setNumberToBuffer(res.val);
            st.enteringNew = true;
            st.isAnswerShown = true;
            if (res.overflow) st.errorState = true; else this.addToGT(res.val);
        }
        Display.render(st);
    },

    pressPercent() {
        this.stopAutoReview();
        const st = this.state;
        if (st.errorState || st.mode !== 'NORMAL') return;
        if (st.pendingOp === null || st.accumulator === null) return;
        st.mrcPendingClear = false;

        const rate = this.getCurrentNumber();
        const base = st.accumulator;
        let raw = 0;
        switch (st.pendingOp) {
            case '*': raw = (base * rate) / 100; break;
            case '/':
                if (rate === 0) { st.errorState = true; Display.render(st); return; }
                raw = (base / rate) * 100;
                break;
            case '+': raw = base + (base * rate) / 100; break;
            case '-': raw = base - (base * rate) / 100; break;
        }
        this.finishSpecial(MathEngine.clean(raw), rate, '%');
    },

    pressMU() {
        this.stopAutoReview();
        const st = this.state;
        if (st.errorState || st.mode !== 'NORMAL') return;
        if (st.accumulator === null || st.pendingOp === null) return;
        st.mrcPendingClear = false;

        const b = this.getCurrentNumber();
        const raw = MathEngine.mu(st.accumulator, b, st.pendingOp);
        if (raw === null) { st.errorState = true; Display.render(st); return; }
        this.finishSpecial(MathEngine.clean(raw), b, 'MU');
    },

    // Shared tail for % and MU
    finishSpecial(res, operand, tag) {
        const st = this.state;
        this.recordStep(operand, tag, false);
        this.recordStep(res.val, '', true);
        this.setNumberToBuffer(res.val);
        st.accumulator = null;
        st.pendingOp = null;
        st.enteringNew = true;
        st.fnResult = false;
        st.isAnswerShown = true;
        if (res.overflow) st.errorState = true; else this.addToGT(res.val);
        Display.render(st);
    },

    pressSqrt() {
        this.stopAutoReview();
        const st = this.state;
        if (st.errorState || st.mode === 'REVIEW') return;
        const val = this.getCurrentNumber();
        if (val < 0) {
            st.errorState = true;
            this.setNumberToBuffer(Math.abs(val));
            Display.render(st);
            return;
        }
        st.mrcPendingClear = false;
        this.setNumberToBuffer(MathEngine.clean(Math.sqrt(val)).val);
        this.markResult();
        Display.render(st);
    },

    addToGT(val) {
        this.state.grandTotal = MathEngine.clean(this.state.grandTotal + val).val;
    },

    pressGT() {
        this.stopAutoReview();
        const st = this.state;
        if (st.errorState || st.mode !== 'NORMAL') return;
        st.mrcPendingClear = false;
        this.setNumberToBuffer(st.grandTotal);
        this.markResult();
        Display.render(st);
    },

    memoryOp(sign) {
        this.stopAutoReview();
        const st = this.state;
        if (st.errorState || st.mode !== 'NORMAL') return;
        st.mrcPendingClear = false;

        let val = this.getCurrentNumber();
        if (st.pendingOp !== null && this.hasOperand()) {
            const calc = MathEngine.exec(st.accumulator, val, st.pendingOp);
            if (calc.overflow) {
                st.errorState = true;
                this.setNumberToBuffer(calc.val);
                Display.render(st);
                return;
            }
            this.recordStep(val, '=', false);
            val = calc.val;
            this.recordStep(val, '', true);
            this.setNumberToBuffer(val);
            st.accumulator = null;
            st.pendingOp = null;
        }

        const memRes = MathEngine.clean(st.memory + sign * val);
        if (memRes.overflow) {
            st.errorState = true;
            Display.render(st);
            return;
        }
        st.memory = memRes.val;
        st.enteringNew = true;
        st.fnResult = false;
        st.isAnswerShown = true;
        Display.render(st);
    },

    pressMRC() {
        this.stopAutoReview();
        const st = this.state;
        if (st.errorState || st.mode !== 'NORMAL') return;
        if (!st.mrcPendingClear) {
            this.setNumberToBuffer(st.memory);
            this.markResult();
            st.mrcPendingClear = true;
        } else {
            st.memory = 0;
            st.mrcPendingClear = false;
        }
        Display.render(st);
    },

    pressC() {
        this.stopAutoReview();
        const st = this.state;
        st.mrcPendingClear = false;

        if (st.errorState || st.stepOverflow) {
            if (st.errorState) {               // clear error, continue from displayed value
                st.accumulator = null;
                st.pendingOp = null;
                st.enteringNew = true;
                st.isAnswerShown = false;
                st.fnResult = false;
            }
            st.errorState = false;
            st.stepOverflow = false;
            Display.render(st);
            return;
        }
        if (st.mode === 'CORRECT') {           // cancel correction, back to review
            st.mode = 'REVIEW';
            this.loadReviewStep();
            return;
        }
        if (st.mode === 'REVIEW') st.mode = 'NORMAL';

        st.inputBuffer = '0';
        st.enteringNew = false;
        st.isAnswerShown = false;
        st.fnResult = false;
        Display.render(st);
    },

    pressAC() {
        this.stopAutoReview();
        Object.assign(this.state, {
            inputBuffer: '0', accumulator: null, pendingOp: null,
            constantMode: false, constantOp: null, constantVal: null,
            repeatOp: null, repeatVal: null,
            enteringNew: true, fnResult: false, isAnswerShown: false,
            errorState: false, stepOverflow: false,
            grandTotal: 0, mrcPendingClear: false,
            steps: [], mode: 'NORMAL', reviewIdx: 0
        });
        Display.render(this.state);
    },

    pressDisp() {
        this.stopAutoReview();
        if (this.state.errorState) return;
        this.state.dispMode = (this.state.dispMode + 1) % 2;
        Display.render(this.state);
    },

    pressStepUp() {
        this.stopAutoReview();
        const st = this.state;
        if (st.errorState || st.steps.length === 0 || st.mode === 'CORRECT') return;
        if (st.mode !== 'REVIEW') {
            st.mode = 'REVIEW';
            st.reviewIdx = st.steps.length - 1;
        } else {
            st.reviewIdx = (st.reviewIdx - 1 + st.steps.length) % st.steps.length;
        }
        this.loadReviewStep();
    },

    pressStepDown() {
        this.stopAutoReview();
        const st = this.state;
        if (st.errorState || st.steps.length === 0 || st.mode === 'CORRECT') return;
        if (st.mode !== 'REVIEW') {
            st.mode = 'REVIEW';
            st.reviewIdx = 0;
        } else {
            st.reviewIdx = (st.reviewIdx + 1) % st.steps.length;
        }
        this.loadReviewStep();
    },

    loadReviewStep() {
        this.setNumberToBuffer(this.state.steps[this.state.reviewIdx].val);
        Display.render(this.state);
    },

    pressCorrect() {
        this.stopAutoReview();
        const st = this.state;
        if (st.errorState || st.steps.length === 0) return;
        if (st.mode === 'REVIEW') {
            if (st.steps[st.reviewIdx].isResult) return;
            st.mode = 'CORRECT';
            st.enteringNew = true;
            Display.render(st);
        } else if (st.mode === 'CORRECT') {
            this.commitCorrection(null);
        }
    },

    commitCorrection(newOp) {
        const step = this.state.steps[this.state.reviewIdx];
        step.val = this.getCurrentNumber();
        if (newOp && step.op !== '=' && step.op !== '%' && step.op !== 'MU') step.op = newOp;
        this.recalculateAllSteps();
        this.state.mode = 'REVIEW';
        this.loadReviewStep();
    },

    recalculateAllSteps() {
        const steps = this.state.steps;
        if (steps.length === 0) return;
        let running = steps[0].val;
        let currentOp = steps[0].op;

        for (let i = 1; i < steps.length; i++) {
            const s = steps[i];
            if (s.isResult) { s.val = running; continue; }
            if (s.op === '%') {
                if (currentOp === '*') running = MathEngine.clean((running * s.val) / 100).val;
                else if (currentOp === '+') running = MathEngine.clean(running + (running * s.val) / 100).val;
                else if (currentOp === '-') running = MathEngine.clean(running - (running * s.val) / 100).val;
                else if (currentOp === '/' && s.val !== 0) running = MathEngine.clean((running / s.val) * 100).val;
            } else if (s.op === 'MU') {
                const raw = MathEngine.mu(running, s.val, currentOp);
                if (raw !== null) running = MathEngine.clean(raw).val;
            } else {
                running = MathEngine.exec(running, s.val, currentOp).val;
                currentOp = s.op;
            }
        }
    },

    pressAutoReview() {
        this.stopAutoReview();
        const st = this.state;
        if (st.errorState || st.steps.length === 0 || st.mode === 'CORRECT') return;

        st.mode = 'REVIEW';
        st.reviewIdx = 0;
        this.loadReviewStep();

        st.autoTimer = setInterval(() => {
            st.reviewIdx++;
            if (st.reviewIdx >= st.steps.length) {
                this.stopAutoReview();
                st.mode = 'NORMAL';
                const last = st.steps[st.steps.length - 1];
                this.setNumberToBuffer(last.val);
                st.isAnswerShown = last.isResult;
                Display.render(st);
                return;
            }
            Feedback.trigger();
            this.loadReviewStep();
        }, 700);
    },

    quickConvert(rate) {
        if (this.state.errorState || this.state.mode !== 'NORMAL') return;
        const res = MathEngine.clean(Number((this.getCurrentNumber() / rate).toFixed(2)));
        this.setNumberToBuffer(res.val);
        this.markResult();
        Display.render(this.state);
    },

    quickGST(rate, add) {
        if (this.state.errorState || this.state.mode !== 'NORMAL') return;
        const v = this.getCurrentNumber();
        const raw = add ? v * (1 + rate / 100) : v / (1 + rate / 100);
        const res = MathEngine.clean(Number(raw.toFixed(2)));
        this.setNumberToBuffer(res.val);
        this.markResult();
        Display.render(this.state);
    }
};

/** 3. DISPLAY */
const Display = {
    els: {
        step: document.getElementById('uiStep'),
        ans: document.getElementById('uiAns'),
        rev: document.getElementById('uiRev'),
        crt: document.getElementById('uiCrt'),
        gt: document.getElementById('uiGT'),
        mem: document.getElementById('uiMem'),
        constK: document.getElementById('uiConst'),
        op: document.getElementById('uiOp'),
        err: document.getElementById('uiErr'),
        digits: document.getElementById('uiDigits')
    },

    formatReadout(strVal, dispMode) {
        const isNeg = strVal.startsWith('-') && parseFloat(strVal) !== 0;
        const clean = strVal.replace('-', '');
        const hasDot = clean.includes('.');
        const [intPart, decPart] = clean.split('.');

        let formattedInt;
        if (dispMode === 0) {   // Indian grouping
            if (intPart.length > 3) {
                const last3 = intPart.slice(-3);
                const rest = intPart.slice(0, -3);
                formattedInt = rest.replace(/\B(?=(\d{2})+(?!\d))/g, "'") + "'" + last3;
            } else formattedInt = intPart;
        } else {                // International grouping
            formattedInt = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, "'");
        }
        return (isNeg ? '-' : '') + formattedInt + (hasDot ? '.' + (decPart || '') : '.');
    },

    // Shrink font so 12 digits + separators never get clipped
    fit() {
        const el = this.els.digits;
        let size = 31;
        el.style.fontSize = size + 'px';
        while (el.scrollWidth > el.clientWidth && size > 12) {
            size--;
            el.style.fontSize = size + 'px';
        }
    },

    render(state) {
        this.els.err.className = 'flag-item' + ((state.errorState || state.stepOverflow) ? ' active' : '');
        this.els.digits.innerText = this.formatReadout(state.inputBuffer, state.dispMode);
        this.fit();

        let stepCount = 0;
        let activeOp = state.pendingOp || '';
        let showAns = state.isAnswerShown;

        if (state.mode === 'REVIEW' || state.mode === 'CORRECT') {
            stepCount = state.reviewIdx + 1;
            const st = state.steps[state.reviewIdx];
            activeOp = st ? st.op : '';
            showAns = st ? st.isResult : false;
        } else {
            stepCount = state.steps.length;
        }
        this.els.step.innerText = stepCount > 0 ? String(stepCount).padStart(3, '0') : '';

        const opMap = { '*': '×', '/': '÷', '+': '+', '-': '−', '=': '=', '%': '%', 'MU': 'MU' };
        this.els.op.innerText = opMap[activeOp] || '';

        this.els.ans.className = 'badge' + (showAns ? ' active' : '');
        this.els.rev.className = 'badge' + (state.mode === 'REVIEW' ? ' active' : '');
        this.els.crt.className = 'badge' + (state.mode === 'CORRECT' ? ' active' : '');
        this.els.gt.className = 'badge' + (state.grandTotal !== 0 ? ' active' : '');
        this.els.mem.className = 'badge' + (state.memory !== 0 ? ' active' : '');
        this.els.constK.className = 'badge' + (state.constantMode ? ' active' : '');
    }
};

/** 4. INPUT & UI CONTROLLER */
const UIController = {
    // [key, left%, top%, height% (default 7.6), width% (default 12.4)]
    KEYMAP: [
        ['AUTO', 35.5, 39.5, 5.6, 12.6], ['CORRECT', 51.8, 39.5, 5.6, 12.6], ['UP', 66.8, 39.5, 5.6, 12.8], ['DOWN', 81.8, 39.5, 5.6, 12.8],
        ['DISP', 4.8, 47.6, 5.5], ['BACK', 19.8, 47.6, 5.5], ['SIGN', 35.5, 47.6, 5.5], ['SQRT', 51.8, 47.6, 5.5], ['MU', 66.9, 47.6, 5.5], ['GT', 82.0, 47.6, 5.5],
        ['7', 4.8, 55.4], ['8', 19.8, 55.4], ['9', 35.5, 55.4], ['PERCENT', 51.8, 55.4], ['C', 66.9, 55.4], ['AC', 82.0, 55.4],
        ['4', 4.8, 65.2], ['5', 19.8, 65.2], ['6', 35.5, 65.2], ['*', 51.8, 65.2], ['/', 66.9, 65.2], ['MRC', 82.0, 65.2],
        ['1', 4.8, 75.0], ['2', 19.8, 75.0], ['3', 35.5, 75.0], ['+', 51.8, 75.0, 17.5], ['-', 66.9, 75.0], ['M-', 82.0, 75.0],
        ['0', 4.8, 84.8], ['00', 19.8, 84.8], ['.', 35.5, 84.8], ['=', 66.9, 84.8], ['M+', 82.0, 84.8]
    ],

    buildKeys() {
        const wrap = document.getElementById('calcWrapper');
        this.KEYMAP.forEach(([key, left, top, h = 7.6, w = 12.4]) => {
            const b = document.createElement('button');
            b.className = 'key-hotspot';
            b.dataset.key = key;
            b.tabIndex = -1;
            b.setAttribute('aria-label', key);
            b.style.cssText = `top:${top}%;left:${left}%;width:${w}%;height:${h}%;`;
            wrap.appendChild(b);
        });
    },

    init() {
        this.buildKeys();
        document.querySelectorAll('.key-hotspot').forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                const k = btn.dataset.key;
                btn.classList.add('pressed');
                Feedback.trigger(k);
                this.dispatchKey(k);
            });
            const release = () => btn.classList.remove('pressed');
            btn.addEventListener('pointerup', release);
            btn.addEventListener('pointerleave', release);
            btn.addEventListener('pointercancel', release);
        });

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            if (e.repeat && e.key !== 'Backspace') return;
            let mapped = null;
            if (e.key >= '0' && e.key <= '9' && e.key.length === 1) mapped = e.key;
            else if (e.key === '.') mapped = '.';
            else if (['+', '-', '*', '/'].includes(e.key)) mapped = e.key;
            else if (e.key === 'Enter' || e.key === '=') mapped = '=';
            else if (e.key === 'Backspace') mapped = 'BACK';
            else if (e.key === 'Escape') mapped = 'AC';
            else if (e.key === 'Delete') mapped = 'C';
            else if (e.key === '%') mapped = 'PERCENT';
            else if (e.key === 'ArrowUp') mapped = 'UP';
            else if (e.key === 'ArrowDown') mapped = 'DOWN';

            if (mapped) {
                e.preventDefault();
                Feedback.trigger(mapped);
                this.dispatchKey(mapped);
            }
        });
    },

    dispatchKey(key) {
        switch (key) {
            case '0': case '1': case '2': case '3': case '4':
            case '5': case '6': case '7': case '8': case '9':
            case '00': Engine.pressDigit(key); break;
            case '.': Engine.pressDecimal(); break;
            case '+': case '-': case '*': case '/': Engine.pressOperator(key); break;
            case '=': Engine.pressEquals(); break;
            case 'PERCENT': Engine.pressPercent(); break;
            case 'SQRT': Engine.pressSqrt(); break;
            case 'SIGN': Engine.pressSign(); break;
            case 'BACK': Engine.pressBackspace(); break;
            case 'MU': Engine.pressMU(); break;
            case 'GT': Engine.pressGT(); break;
            case 'M+': Engine.memoryOp(1); break;
            case 'M-': Engine.memoryOp(-1); break;
            case 'MRC': Engine.pressMRC(); break;
            case 'C': Engine.pressC(); break;
            case 'AC': Engine.pressAC(); break;
            case 'DISP': Engine.pressDisp(); break;
            case 'UP': Engine.pressStepUp(); break;
            case 'DOWN': Engine.pressStepDown(); break;
            case 'CORRECT': Engine.pressCorrect(); break;
            case 'AUTO': Engine.pressAutoReview(); break;
        }
    },

    toggleDrawer() {
        document.getElementById('caDrawer').classList.toggle('open');
    }
};

Feedback.init();
UIController.init();
Engine.init();

    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    });
}
